<!DOCTYPE html>
<html>

	<title>Практика</title>
	<link rel="stylesheet" href="style/style.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">

<body>

	<header class="header">

	<main>

				<img src="image/2.png" alt="1">

						<img src="image/brain1.png" alt="">
					</div>
					<div class="brain">
						<img src="image/brain2.png" alt="">
					</div>
					<div class="brain">
						<img src="image/brain3.png" alt="">
					</div>
					<div class="brain">
						<img src="image/brain4.png" alt="">
					</div>
				</div>
			</div>

			<div class="slider">
				<button class="arrows left"><img src="image/red0.png" alt=""></button>
				<div class="cards">
					<div class="card3">
						<img src="image/red1.png" alt="">
					</div>
					<div class="card3">
						<img src="image/red2.png" alt="">
					</div>
					<div class="card3">
						<img src="image/red4.png" alt="">
					</div>
				</div>
				<button class="arrows right"><img src="image/red5.png" alt=""></button>
